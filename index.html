    <style>
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--app-bg, #0d1117); 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-color, #4b5563); 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6b7280; 
      }
      
      /* Theme Variables Default */
      :root {
        --app-bg: #0d1117;
        --sidebar-bg: #010409;
        --card-bg: #161b22;
        --text-primary: #f0f6fc;
        --text-secondary: #8b949e;
        --accent-bg: #00a3c4;
        --accent-solid: #00a3c4;
        --border-color: #30363d;
      }

      body {
        background-color: var(--app-bg);
        color: var(--text-primary);
      }
    </style>
